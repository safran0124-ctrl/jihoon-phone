
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>이지훈의 휴대폰</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202020;color:#eee;font-family:Arial,"Malgun Gothic",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
#phone{height:100dvh;width:100%;max-width:430px;margin:auto;display:flex;flex-direction:column;background:#050505;overflow:hidden}
.status{height:27px;flex:none;background:#050505;padding:5px 13px;font-size:12px;display:flex;justify-content:space-between}
.topbar{height:47px;flex:none;background:#222;border-bottom:1px solid #444;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.topbar button{background:none;border:0;font-size:28px}
.topbar strong{font-size:17px}
.topbar small{color:#aaa}
#screen{flex:1;min-height:0;overflow:auto;background:#050505}
.nav{height:47px;flex:none;display:flex;align-items:center;justify-content:space-around;background:linear-gradient(#222,#080808);border-top:1px solid #444}
.nav button{width:30%;height:100%;background:none;border:0;color:#aaa;font-size:22px}
.homekey{width:54px!important;height:28px!important;border:4px solid #555!important;border-radius:10px!important}
.hidden{display:none!important}
.home{min-height:100%;display:flex;flex-direction:column;padding:18px 15px 8px;background:radial-gradient(ellipse at 75% 18%,#383838,transparent 40%),linear-gradient(145deg,#080808,#202020 48%,#050505)}
.home-date{text-align:right;color:#aaa;font-size:12px;margin:4px 2px 17px}
.dday{min-height:128px;border:1px solid #555;background:linear-gradient(135deg,#080808dd,#292929cc,#090909ee);padding:16px 18px;margin-bottom:25px}
.initials{font-size:27px;letter-spacing:4px;margin-bottom:7px}
.days{font-size:31px}
.dday .date{font-size:11px;color:#aaa;margin-top:7px}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 5px}
.app-icon{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;padding:0}
.glyph{height:47px;width:47px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#444,#1a1a1a);border:1px solid #666;font-size:25px}
.home-dock{margin-top:auto;padding:14px 0 8px;border-top:1px solid #5558;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.home-footer{text-align:center;font-size:10px;color:#888;padding:4px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#191919}
.tabs button{height:43px;background:linear-gradient(#333,#171717);border:1px solid #080808;font-size:clamp(10px,3vw,13px);white-space:nowrap}
.tabs button.active{background:#555}
.keypad-display{height:clamp(190px,29vh,260px);min-height:190px;background:#ddd;color:#222;display:flex;align-items:center;justify-content:center;font-size:25px;flex:none;overflow-wrap:anywhere;padding:12px}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
.key{height:clamp(60px,9vh,83px);border:1px solid #080808;background:linear-gradient(#303030,#171717);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(27px,7vw,34px)}
.key small{font-size:11px;color:#aaa;margin-top:3px}
.key-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:6px 0}
.key-actions button{height:48px;background:#444;border:1px solid #555;font-size:13px}
.person{width:100%;min-height:62px;padding:11px 13px;background:#080808;border:0;border-bottom:1px solid #383838;text-align:left;display:flex;justify-content:space-between;align-items:center}
.name{font-size:14px}.number,.sub{font-size:11px;color:#999;margin-top:5px}
.missed{color:#f44}.callmark{font-size:22px;color:#aaa}
.section-label{padding:7px 13px;background:#292929;color:#aaa;font-size:12px}
.chat-row{width:100%;min-height:67px;padding:11px 13px;background:#080808;border:0;border-bottom:1px solid #333;display:flex;align-items:center;gap:10px;text-align:left}
.chat-info{flex:1;min-width:0}.chat-name{font-size:14px;margin-bottom:5px}
.preview{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:10px;color:#999}
.chat-layout{height:100%;min-height:0;display:flex;flex-direction:column}
.messages{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:12px 9px 18px}
.day{align-self:center;background:#555;border-radius:13px;padding:5px 10px;font-size:10px;margin:5px 0}
.bubble{align-self:flex-start;max-width:84%;background:#303030;border-radius:4px;padding:9px 10px 6px;font-size:13px;line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap}
.bubble.mine{align-self:flex-end;background:#555}
.bubble .time{display:block;text-align:right;color:#bbb;font-size:10px;margin-top:4px}
.chat-compose{display:flex;gap:5px;padding:7px;background:#222;border-top:1px solid #444;flex:none}
.chat-compose input{flex:1;width:0;min-width:0;padding:10px;background:#111;border:1px solid #555;font-size:16px;outline:none}
.chat-compose button{width:60px;flex:none;background:#444;border:1px solid #666;font-size:13px}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}
.note{height:128px;overflow:hidden;text-align:left;background:#fff09a;color:#403a22;border:1px solid #d2c46b;padding:9px}
.note .date{font-size:9px;color:#877b43;margin-bottom:6px}
.note strong{display:block;font-size:11px;margin-bottom:7px}
.note p{font-size:10px;line-height:1.4;margin:0;white-space:pre-line}
.note-full{padding:18px;background:#fff09a;color:#403a22;min-height:100%;line-height:1.8;white-space:pre-wrap}
.alarm{padding:17px;border-bottom:1px solid #333;display:flex;justify-content:space-between}
.alarm strong{font-size:27px;font-weight:400}.alarm small{display:block;color:#999;margin-top:4px}
.news-item{padding:14px;border-bottom:1px solid #333}
.news-item small{color:#888}.news-item h3{font-size:15px;margin:7px 0}
.news-item p{font-size:12px;line-height:1.6;color:#bbb}
.gallery-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:2px}
.gallery-tile{aspect-ratio:1;background:linear-gradient(135deg,#333,#111);display:flex;align-items:center;justify-content:center;color:#888;font-size:11px}
.music-row{padding:11px 13px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #333}
.music-row button{background:#333;border:1px solid #555;padding:8px}
.track{flex:1;font-size:12px}.track small{display:block;color:#999;margin-top:4px}
.call-screen{height:100%;min-height:420px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(#292929,#050505);padding:35px 18px 18px}
.call-name{font-size:24px;margin-top:15px}.call-number{font-size:12px;color:#aaa;margin-top:7px}
.call-state{font-size:13px;color:#bbb;margin-top:13px}
.call-spacer{flex:1}.call-controls{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;width:100%;max-width:300px}
.call-controls button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:10px;color:#ddd}
.circle{height:48px;width:48px;border-radius:50%;background:#444;display:flex;align-items:center;justify-content:center;font-size:20px}
.hang{margin-top:20px;width:62px;height:51px;border:0;border-radius:35px;background:#d32b2b;font-size:24px}
.lock{height:100%;display:flex;flex-direction:column;background:linear-gradient(135deg,#111,#333,#050505)}
.lock-status{padding:9px 13px;display:flex;justify-content:space-between;font-size:12px}
.lock-clock{text-align:center;margin-top:12%}.clock{font-size:clamp(52px,15vw,65px);font-weight:300}
.lock-clock .date{font-size:14px;margin-top:5px}
.lock-hint{margin-top:auto;margin-bottom:32px;text-align:center;font-size:13px;color:#ddd}
.passcode{width:100%;height:100%;min-height:100%;background:#222;display:flex;flex-direction:column;align-items:center;padding:clamp(30px,7vh,65px) 7vw 4vh}
.passcode h3{font-size:clamp(17px,4.5vw,21px);font-weight:400;margin:0 0 clamp(25px,5vh,48px);text-align:center}
.dots{display:flex;justify-content:center;gap:20px;margin:0 0 clamp(25px,5vh,48px);flex:none}
.dot{width:13px;height:13px;border:1px solid #ddd;border-radius:50%}
.dot.filled{background:#ddd}
.passkeys{width:78%;max-width:300px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.7vh,14px)}
.passkeys button{width:100%;height:clamp(58px,8.3vh,82px);border-radius:50%;background:#333;border:1px solid #555;font-size:clamp(21px,6vw,27px)}
@media(max-height:650px){.passcode{padding-top:18px}.passcode h3{margin-bottom:18px}.dots{margin-bottom:18px}.passkeys{gap:6px}.passkeys button{height:48px}.key{height:55px}}
@media(min-width:500px){#phone{height:min(100dvh,900px);border-radius:24px}body{display:flex;align-items:center}}
</style>
</head>
<body>
<div id="phone">
 <div class="status" id="status"><span id="clockNow">오전 06:11</span><span>▂▄▆　Wi-Fi　▰</span></div>
 <div class="topbar hidden" id="topbar"><button onclick="back()">‹</button><strong id="pageTitle">홈</strong><small>2014.10</small></div>
 <main id="screen"></main>
 <div class="nav hidden" id="nav"><button onclick="openApp('menu')">☰</button><button class="homekey" onclick="goHome()"></button><button onclick="back()">↶</button></div>
</div>
<script>
const $=s=>document.querySelector(s),screen=$("#screen");
const STORE="jihoon_phone_2014_winter_v1";
const HISTORY_KEY="jihoon_soonyoung_history_added_v2";
const CLEAN_KEY="jihoon_soonyoung_apology_cleanup_v2";

let saved={};
try{saved=JSON.parse(localStorage.getItem(STORE)||"{}")}catch(e){}
let chats=saved.chats||{};
let logs=saved.logs||[
 ["권순영","부재중 전화","10.16 06:11",true],
 ["권순영","발신 통화","10.16 05:50",false],
 ["문준휘","부재중 전화","10.15 18:09",true],
 ["최한솔","수신 통화","10.15 21:35",false],
 ["이석민","발신 통화","10.15 20:18",false]
];
let page="lock",phoneTab="키패드",dial="",chatPerson="",callPerson="",callMode="outgoing",seconds=0,timer=null,replyTimer=null,noteIndex=0,pin="";
let callTriggered=false,callSequenceStarted=false;

const trainees=[
 ["최승철","010-2014-0515"],["윤정한","010-2014-0516"],["홍지수","010-2014-0517"],
 ["문준휘","010-2014-0518"],["권순영","010-2014-0519"],["전원우","010-2014-0520"],
 ["이지훈","010-2014-0521"],["서명호","010-2014-0522"],["김민규","010-2014-0523"],
 ["이석민","010-2014-0524"],["부승관","010-2014-0525"],["최한솔","010-2014-0526"],["이찬","010-2014-0527"]
];
const contacts=[...trainees,["대표님","02-2014-1000"],["인사팀 누나","010-2014-1001"],["엄마","010-2014-1002"],["아빠","010-2014-1003"]];
const favorites=["권순영","인사팀 누나"];
const notes=[
 ["10월 평가회 할 일","6시 / 10월 평가회 노래 죽일놈 연습하기\n10시 / 10월 평가회 으르렁 댄스 디테일 마지막으로 잡기\n12시 / 퇴근!!"],
 ["9월 평가회 피드백","디테일 조금 더 신경쓰기\n선 더 쭉 피기\n안무 조금 더 칼각으로 맞추기\n나만 잘한다고 전체 평가가 잘 되는 건 아닌 걸 생각하기.."],
 ["2014.10.16 · 01:12","권수녕 미친놈이 지만 예민한 거 아닌데\n나도 나도 힘든데 지만 생각하지 또..\n순녕이가 요즘 많이 힘들어 보이긴 했는데.."],
 ["가사","어떤 표현법을 써야만\n내 맘이 전해질까\n예쁜 말 모두 모아서\n주고 싶은데\n새벽에 물을 마시면서\n혼자 다짐해 나는 너에게"]
];

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function persist(){try{localStorage.setItem(STORE,JSON.stringify({chats,logs}))}catch(e){}}
function timeNow(){return new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false})}
function setPage(p,t){page=p;$("#pageTitle").textContent=t||p;render()}
function render(){
 $("#status").classList.toggle("hidden",page==="lock"||page==="pin");
 $("#topbar").classList.toggle("hidden",page==="lock"||page==="pin");
 $("#nav").classList.toggle("hidden",page==="lock"||page==="pin");
 const map={lock:renderLock,pin:renderPin,home:renderHome,phone:renderPhone,contacts:renderContacts,kakao:renderKakao,chat:renderChat,call:renderCall,memo:renderMemo,note:renderNote,alarm:renderAlarm,gallery:renderGallery,news:renderNews,music:renderMusic,menu:renderMenu};
 (map[page]||renderHome)();
}
function renderLock(){
 screen.innerHTML=`<div class="lock" id="lock"><div class="lock-status"><span>● SKT</span><span>Wi-Fi　100%</span></div><div class="lock-clock"><div class="clock">06:11</div><div class="date">2014년 10월 16일 목요일</div></div><div class="lock-hint">화면을 눌러 잠금 해제　↑</div></div>`;
 let y=0;const el=$("#lock");el.ontouchstart=e=>y=e.touches[0].clientY;el.ontouchend=e=>{if(y-e.changedTouches[0].clientY>30)setPage("pin","비밀번호")};el.onclick=()=>setPage("pin","비밀번호");
}
function renderPin(){
 screen.innerHTML=`<div class="passcode"><h3>비밀번호를 입력하세요</h3><div class="dots">${[0,1,2,3].map(i=>`<span class="dot ${pin.length>i?"filled":""}"></span>`).join("")}</div><div class="passkeys">${["1","2","3","4","5","6","7","8","9","⌫","0","↵"].map(n=>`<button onclick="pinKey('${n}')">${n}</button>`).join("")}</div></div>`;
}
function pinKey(n){
 if(n==="⌫")pin=pin.slice(0,-1);
 else if(n==="↵"){if(pin==="5160"){pin="";setPage("home","홈")}else{pin="";renderPin()}return}
 else if(pin.length<4)pin+=n;
 if(pin==="5160"){pin="";setPage("home","홈")}else renderPin();
}
function renderHome(){
 const apps=[["전화","phone","☎"],["카톡","kakao","▣"],["연락처","contacts","♙"],["음악","music","♫"],["뉴스","news","▤"],["메모","memo","▧"],["알람","alarm","◷"],["갤러리","gallery","▦"]];
 screen.innerHTML=`<div class="home"><div class="home-date">2014년 10월 16일 목요일</div><div class="dday"><div class="initials">S ♡ H</div><div class="days">143일째</div><div class="date">2014년 10월 16일 · 목요일</div></div><div class="home-grid">${apps.map(a=>`<button class="app-icon" onclick="openApp('${a[1]}')"><span class="glyph">${a[2]}</span><span>${a[0]}</span></button>`).join("")}</div><div class="home-dock">${apps.slice(0,4).map(a=>`<button class="app-icon" onclick="openApp('${a[1]}')"><span class="glyph">${a[2]}</span><span>${a[0]}</span></button>`).join("")}</div><div class="home-footer">이지훈 · 2014.10</div></div>`;
}
function openApp(p){if(p==="phone"){phoneTab="키패드";setPage(p,"전화")}else setPage(p,({kakao:"카톡",contacts:"연락처",memo:"메모",alarm:"알람",gallery:"갤러리",news:"뉴스",music:"음악",menu:"메뉴"})[p]||p)}
function goHome(){if(page==="call"){endCall();return}if(page==="chat"){setPage("kakao","카톡");return}setPage("home","홈")}
function back(){if(page==="chat"){setPage("kakao","카톡");return}if(page==="note"){setPage("memo","메모");return}if(page==="call"){endCall();return}if(page==="pin"){setPage("lock","");return}setPage("home","홈")}
function renderMenu(){screen.innerHTML=`<div class="home-grid" style="padding:20px">${[["전화","phone"],["카톡","kakao"],["연락처","contacts"],["음악","music"],["뉴스","news"],["메모","memo"],["알람","alarm"],["갤러리","gallery"]].map(a=>`<button class="app-icon" onclick="openApp('${a[1]}')"><span class="glyph">▣</span><span>${a[0]}</span></button>`).join("")}</div>`}

/* 전화 */
function renderPhone(){
 let body="";
 if(phoneTab==="키패드"){
  const keys=[["1",""],["2","ABC"],["3","DEF"],["4","GHI"],["5","JKL"],["6","MNO"],["7","PQRS"],["8","TUV"],["9","WXYZ"],["*",""],["0","+"],["#",""]];
  body=`<div class="keypad-display">${esc(dial||"")}</div><div class="keypad">${keys.map(k=>`<button class="key" onclick="dial+='${k[0]}';renderPhone()">${k[0]}<small>${k[1]}</small></button>`).join("")}</div><div class="key-actions"><button onclick="dial=dial.slice(0,-1);renderPhone()">⌫ 삭제</button><button onclick="dial='';renderPhone()">지우기</button><button onclick="startCall()">☎ 통화</button></div>`;
 }else if(phoneTab==="통화기록")body=logs.map((x,i)=>`<button class="person" onclick="callFromLog(${i})"><div><div class="name">${esc(x[0])}</div><div class="sub ${x[3]?"missed":""}">${esc(x[1])}　${esc(x[2])}</div></div><span class="callmark">☎</span></button>`).join("");
 else{
  const list=phoneTab==="즐겨찾기"?contacts.filter(c=>favorites.includes(c[0])):contacts;
  body=list.map((p,i)=>`${i===0||p[0][0]!==list[i-1][0][0]?`<div class="section-label">${p[0][0]}</div>`:""}<button class="person" onclick="chooseContact('${p[0]}')"><div><div class="name">${p[0]}</div><div class="number">${p[1]}</div></div><span class="callmark">›</span></button>`).join("");
 }
 screen.innerHTML=`<div class="tabs">${["키패드","통화기록","연락처","즐겨찾기"].map(t=>`<button class="${t===phoneTab?"active":""}" onclick="phoneTab='${t}';renderPhone()">${t}</button>`).join("")}</div>${body}`;
}
function renderContacts(){screen.innerHTML=`<div class="section-label">연락처 ${contacts.length}개</div>${contacts.map((p,i)=>`${i===0||p[0][0]!==contacts[i-1][0][0]?`<div class="section-label">${p[0][0]}</div>`:""}<button class="person" onclick="chooseContact('${p[0]}')"><div><div class="name">${p[0]}</div><div class="number">${p[1]}</div></div><span class="callmark">›</span></button>`).join("")}`}
function chooseContact(n){callPerson=n;callMode="outgoing";seconds=0;logs.unshift([n,"발신 통화","10.16 "+timeNow(),false]);persist();setPage("call",n)}
function callFromLog(i){chooseContact(logs[i][0])}
function startCall(){const f=contacts.find(c=>c[1].replaceAll("-","")===dial.replaceAll("-",""));callPerson=f?f[0]:dial||"알 수 없는 번호";callMode="outgoing";seconds=0;logs.unshift([callPerson,"발신 통화","10.16 "+timeNow(),false]);persist();setPage("call",callPerson)}

function getChat(n){if(!chats[n])chats[n]=[];return chats[n]}
function seedChat(n){
 const a=getChat(n);if(a.length)return;
 const preset={
 "권순영":[
 ["2014.05.15","권순영","오늘 새로 들어왔어 반가워"],
 ["2014.05.15","이지훈","응 안녕 ㅋㅋ"],
 ["2014.05.15","권순영","나 권순영이야"],
 ["2014.05.15","이지훈","이지훈이야"],
 ["2014.05.15","권순영","너 나보다 먼저 들어왔다며"],
 ["2014.05.15","이지훈","응 조금 먼저 들어왔어 ㅋㅋ"],
 ["2014.05.15","권순영","그럼 연습실 어디인지 알려주라"],
 ["2014.05.15","이지훈","ㅋㅋ 이쪽으로 오면 돼"]
 ],

/* 저장된 과거 사과 톡에서 반복 문구만 한 개씩 남김 */
function cleanOldApologies(){
 if(localStorage.getItem(CLEAN_KEY)==="1")return;
 const a=getChat("권순영");
 const phrases=new Set(["왜 끊어","미안해","받아줘","아직 연습실이야?","기다려 조금만 기다려줘","지금 갈게"]);
 const seen=new Set();
 chats["권순영"]=a.filter(m=>{
  if(m.from!=="권순영"||!phrases.has(m.text))return true;
  if(seen.has(m.text))return false;
  seen.add(m.text);
  return true;
 });
 localStorage.setItem(CLEAN_KEY,"1");
 persist();
}

function renderChat(){

function respondTo(text){
 const t=text.toLowerCase();let reply;
 if(/괜찮아|괜찮다고/.test(t))reply="안 괜찮으면서 괜찮다고 하지 마…";
 else if(/미안/.test(t))reply="네가 왜 미안해. 내가 미안하지.";
 else if(/왜 그랬|왜 그래/.test(t))reply="내가 힘들다고 너한테 너무 못되게 굴었어. 미안해.";
 else if(/사랑해|좋아해/.test(t))reply="나도 많이 사랑해. 진심이야.";
 else if(/기다|언제 와|어디야/.test(t))reply="지금 갈게. 조금만 기다려 줘.";
 else if(/응|어|그래|웅/.test(t))reply="고마워… 내 얘기 들어줘서.";
 else if(/보고 싶/.test(t))reply="나도 보고 싶어. 지금 네 옆에 가고 싶다.";
 else if(/권순영/.test(t))reply="응 지훈아.";
 else if(/꺼져/.test(t))reply="네가 그러고 싶으면 그럴게 지훈아.";
 else reply="응 미안해 다 말햐 듣고 있어
 if(replyTimer)clearTimeout(replyTimer);
 replyTimer=setTimeout(()=>{
  getChat("권순영").push({date:"2014.10.16",from:"권순영",text:reply,time:timeNow()});
  persist();if(page==="chat"&&chatPerson==="권순영")renderChat();
 },1300);
}

/* 통화 종료 후 사과 메시지 시퀀스는 한 번만 시작 */
function renderCall(){

  screen.innerHTML=`<div class="call-screen">
    <div class="call-name">${esc(callPerson)}</div>
    <div class="call-number">${contacts.find(c=>c[0]===callPerson)?.[1]||""}</div>
    <div class="call-state">${callMode==="incoming"?"수신 전화":"통화 중"} ${String(Math.floor(seconds/60)).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}</div>
    <div class="call-spacer"></div>
    ${callMode==="incoming"?`<button onclick="answerCall()" style="background:#269b55;border:0;border-radius:28px;padding:15px 30px;color:white;font-size:18px">☎ 받기</button>`:""}
    <button class="hang" onclick="endCall()">☎</button>
  </div>`;
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{
    seconds++;
    const s=$(".call-state");
    if(s)s.textContent=(callMode==="incoming"?"수신 전화":"통화 중")+" "+String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
  },1000);
}
function answerCall(){
  if(callPerson!=="권순영")return;
  callMode="connected";
  renderCall();
  window.soonyoungAudio=new Audio("soonyoung.mp3");
  window.soonyoungAudio.play().catch(()=>{});
}
function endCall(){
  if(timer)clearInterval(timer);
  timer=null;
  if(window.soonyoungAudio){
    window.soonyoungAudio.pause();
    window.soonyoungAudio.currentTime=0;
    window.soonyoungAudio=null;
  }
  logs.unshift([callPerson,callMode==="incoming"?"부재중 전화":"통화 종료","10.16 "+timeNow(),callMode==="incoming"]);
  persist();
  if(callPerson==="권순영"){
    setPage("chat","권순영");
    startApologyAfterCall();
  }else{
    phoneTab="통화기록";
    setPage("phone","전화");
  }
}


function startApologyAfterCall(){
 if(callSequenceStarted)return;
 callSequenceStarted=true;
 const arr=getChat("권순영"),msgs=["왜 끊어","미안해","받아줘","아직 연습실이야?","기다려 조금만 기다려줘","지금 갈게"];
 let i=0;
 function next(){
  if(i>=msgs.length){persist();return}
  const text=msgs[i++];
  /* 과거에 이미 있는 문구는 다시 보내지 않음 */
  if(!arr.some(m=>m.from==="권순영"&&m.text===text)){
   arr.push({date:"2014.10.16",from:"권순영",text,time:timeNow(),apologySequence:true});
  }
  persist();if(page==="chat"&&chatPerson==="권순영")renderChat();
  if(i<msgs.length)replyTimer=setTimeout(next,1700);
 }
 next();
}
