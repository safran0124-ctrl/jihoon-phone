function openApp(id,push=true){if(push&&current!==id)historyStack.push(current);current=id;let s=$('#screen');
if(id==='home'){renderHome();return}
if(id==='messages'){s.innerHTML=`<div class="view">${head('메시지',true,'✎')}<div class="search"><input placeholder="검색" oninput="filterRows(this.value,'messageRows')"></div><div id="messageRows">${[['알 수 없는 번호','한강 물 차갑더라. 곧 네가 직접 확인하게 될 거다.','0999'],['전원우','번호 보냈어. 혼자 움직이지 마.','0203'],['윤정한','…','0201'],['홍지수','정한이 연락 왔어?','0101'],['최한솔','사진 파일 이름이 0305예요.','0104'],['서명호','창고는 확인하지 마.','0103'],['문준휘','오늘 밤 가게는 제가 볼게요.','0102'],['최승철','항구 창고 근처다.','0202']].map((m,i)=>`<div class="rowitem" data-search="${m.join(' ')}" onclick="openChat('${m[0]}')"><div class="miniicon" style="--c:#2388df">✉</div><div class="rowmain"><div class="rowtitle">${m[0]}</div><div class="sub">${m[1]}</div></div><span class="arrow">›</span></div>`).join('')}</div></div>`;unread=0;return}
if(id==='contacts'){s.innerHTML=`<div class="view">${head('연락처',true,'＋')}<div class="search"><input placeholder="이름 검색" oninput="filterRows(this.value,'contactRows')"></div><div id="contactRows">${contacts.map(c=>`<div class="rowitem" data-search="${c.join(' ')}" onclick="contactDetail('${c[0]}')"><div class="miniicon" style="--c:#6d7788">👤</div><div class="rowmain"><div class="rowtitle">${c[0]}</div><div class="sub">${c[1]}<br>${c[2]}</div></div><span class="arrow">›</span></div>`).join('')}</div></div>`;return}
